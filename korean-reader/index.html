<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff"><meta name="description" content="中文小说阅读书架：保留原文排版与插图。">
<title>문장 사이 · 中文阅读</title><link rel="stylesheet" href="./style.css?v=20261112-reader-v2">
</head>
<body>
<header class="site-header"><div class="header-inner">
<button class="brand" type="button" id="brand" aria-label="返回书架">문장 사이</button>
<div class="site-actions"><button type="button" class="top-link" id="shelf-trigger">书架</button></div>
</div></header><main>
<section id="reader-view" class="view article-shell hidden"><nav class="reader-crumb"><button id="reader-back" type="button">返回目录</button></nav>
<div class="article-head"><h1 id="article-title">中文小说</h1><div id="chapter-subtitle" class="chapter-subtitle"></div><div class="byline"><span id="article-author"></span></div></div>
<div class="article-controls"><button type="button" id="search-trigger" class="control-link">查找</button><button type="button" id="type-trigger" class="control-link type-btn" aria-label="调节字号">Aa</button></div>
<div id="type-panel" class="type-panel hidden"><span class="panel-intro">字体大小</span><button type="button" id="font-minus">A−</button><button type="button" id="font-plus">A＋</button></div>
<div id="search-panel" class="search-panel hidden"><input id="search-input" type="search" placeholder="搜索当前章节的中文…" aria-label="搜索中文"><button id="search-clear" type="button">关闭</button></div>
<p id="unfinished-note" class="translation-notice hidden"></p>
<article id="paragraphs" class="story-body" aria-label="中文小说正文"></article>
<div class="article-end">本篇结束</div><nav id="chapter-nav" class="chapter-nav hidden" aria-label="章节导航"></nav>
<footer class="reading-footer"><span>문장 사이</span><span id="article-count" class="visually-hidden"></span></footer>
</section>
<section id="series-view" class="view content-container hidden">
 <div class="section-heading"><button id="series-back" class="back-link" type="button">返回书架</button><div class="eyebrow">CHAPTERS</div><h1 id="series-title">作品目录</h1><p id="series-meta"></p></div><div id="chapter-list" class="book-list"></div>
 </section>
 <section id="import-view" class="view content-container hidden"><div class="section-heading"><div class="eyebrow">READING LIBRARY</div><h1>书架</h1><p>选择作品，再进入章节目录。</p></div><div id="book-list" class="book-list" aria-label="书架中的小说"></div></section>
</main><div id="toast" class="toast hidden" role="status"></div>
<script src="./app.js?v=20261112-reader-v2" defer></script></body></html>
